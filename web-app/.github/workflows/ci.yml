name: CI

on: [push, pull_request]

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Run verifier tests
        run: cargo test --workspace
        working-directory: ./pow
      - name: Build wasm miner
        run: wasm-pack build --target web --out-dir pkg
        working-directory: ./pow/miner-wasm
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v3
        with:
          name: miner-wasm
          path: ./pow/miner-wasm/pkg

  php-test:
    runs-on: ubuntu-latest
    services:
      mysql: # Use a MySQL service for database testing
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >- # Healthcheck to ensure MySQL is ready
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, dom, filter, gd, mbstring, openssl, session, simplexml, xml, ctype, json
          coverage: none
      - name: Copy .env.example
        run: cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist
      - name: Generate app key
        run: php artisan key:generate
      - name: Configure database
        run: |
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=homestead/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=homestead/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=secret/DB_PASSWORD=password/' .env
      - name: Run migrations
        run: php artisan migrate --force
      - name: Run PHPUnit tests
        run: php artisan test
