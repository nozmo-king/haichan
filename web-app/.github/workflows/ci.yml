name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Run verifier tests
        run: cd pow/verifier && cargo test
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Run miner-wasm tests
        run: cd pow/miner-wasm && wasm-pack test --headless --chrome

  php-test:
    runs-on: ubuntu-latest
    services:
      mysql: 
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, dom, filter, gd, mbstring, openssl, session, simplexml, xml, bcmath, ctype, json, tokenizer
          ini-values: post_max_size=256M, upload_max_filesize=256M
          coverage: none
      - name: Copy .env.example
        run: cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: Generate app key
        run: php artisan key:generate
      - name: Run migrations
        run: php artisan migrate --force
      - name: Run PHPUnit tests
        run: php artisan test

  publish-miner-wasm:
    needs: [rust-test, php-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build miner-wasm
        run: cd pow/miner-wasm && wasm-pack build --target web
      - name: Upload miner-wasm artifact
        uses: actions/upload-artifact@v3
        with:
          name: miner-wasm
          path: pow/miner-wasm/pkg