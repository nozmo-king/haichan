name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ '**' ]

jobs:
  node:
    name: Node Type-Check, Build, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - run: |
          npx --yes eslint --version || npm i -D eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin
          npx --yes prettier --version || npm i -D prettier
          npm run lint
  php:
    name: PHP Tests and Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env || true
      - run: php artisan key:generate || true
      - run: php artisan test --colors=always
      - name: Install Pint
        run: |
          composer require laravel/pint --dev --no-interaction || true
      - name: Run Pint (test mode)
        run: ./vendor/bin/pint --test || (echo "Run Pint locally to fix formatting" && exit 1)
  rust:
    name: Rust Verifier Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pow/verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - run: cargo test --all --verbose
  wasm:
    name: WASM Miner Tests (Headless Chrome)
    runs-on: ubuntu-latest
    if: >-
      contains(join(fromJson('[''push'',''pull_request'']'), ','), github.event_name)
      && (github.event_name == 'push' || github.event.pull_request != null)
    paths:
      - 'pow/**'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain for wasm
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run wasm-pack tests
        working-directory: pow/miner-wasm
        env:
          CHROME: chrome
        run: |
          wasm-pack test --headless --chrome
