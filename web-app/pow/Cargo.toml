[workspace]
members = ["verifier", "miner-wasm", "utils/nonce_finder"]
resolver = "2"

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
