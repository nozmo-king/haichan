
[package]
name = "pow-verifier"
version = "0.1.0"
edition = "2021"

[lib]
name = "verifier"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "populate_vectors"
path = "src/bin/populate_vectors.rs"
