
[package]
name = "pow-miner-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
sha2 = "0.10"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }
pow-verifier = { path = "../verifier" }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Performance", 
  "Window",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
