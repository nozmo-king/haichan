<!DOCTYPE html>
<html>
<head>
    <title>Test Doodle</title>
    <script src="/js/doodle-pow.js"></script>
</head>
<body>
    <h1>Doodle Test Page</h1>
    <canvas id="test-canvas" style="border: 2px solid black;"></canvas>
    <div id="entropy">Entropy: 0</div>
    <button onclick="testDraw()">Test Draw</button>
    
    <script>
        console.log('Starting doodle test...');
        
        const doodle = new DoodlePoW('test-canvas', {
            onEntropyUpdate: (e) => {
                document.getElementById('entropy').textContent = 'Entropy: ' + e;
            },
            onProofFound: (proof) => {
                console.log('Proof found!', proof);
            }
        });
        
        function testDraw() {
            console.log('Test draw clicked');
            doodle.drawSpiral();
        }
        
        console.log('DoodlePoW instance:', doodle);
        console.log('Canvas:', doodle.canvas);
        console.log('Canvas dimensions:', doodle.canvas.width, 'x', doodle.canvas.height);
    </script>
</body>
</html>
