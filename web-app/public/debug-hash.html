<!DOCTYPE html>
<html>
<head>
    <title>Hash Debug</title>
</head>
<body>
    <h1>Hash Debug Tool</h1>
    <div id="results"></div>
    
    <script>
    async function testHash() {
        const challengeData = "thread:gen:TEST:f0f1e832b32ae9db468e480836606722";
        const nonce = "13016";
        const dataToHash = challengeData + ":" + nonce;
        
        console.log("Data to hash:", dataToHash);
        
        const encoder = new TextEncoder();
        const dataBuffer = encoder.encode(dataToHash);
        const hashBuffer = await crypto.subtle.digest('SHA-256', dataBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        
        document.getElementById('results').innerHTML = 
            '<strong>Data:</strong> ' + dataToHash + '<br>' +
            '<strong>Hash:</strong> ' + hash + '<br>' +
            '<strong>Expected:</strong> 21e8c23ba2b8ff7c72959ca0f449380156d2cc2579c697b5e1d807f2536ed7dc<br>' +
            '<strong>Match:</strong> ' + (hash === '21e8c23ba2b8ff7c72959ca0f449380156d2cc2579c697b5e1d807f2536ed7dc' ? 'YES' : 'NO');
    }
    
    testHash();
    </script>
</body>
</html>
